name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install "ruff==0.6.9"

      - name: Run ruff
        run: ruff check .

  test:
    name: Django checks + tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: veritruth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --port=3306 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      # Throwaway CI-only values. Real credentials live in a local .env that is
      # git-ignored, and GROQ_API_KEY is intentionally absent so the AI explainer
      # runs its offline fallback instead of calling an external service.
      SECRET_KEY: ci-only-placeholder-secret-key-not-used-anywhere-else
      DEBUG: "True"
      DB_NAME: veritruth_db
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version

      # CPU wheels: the default PyTorch build pulls ~2 GB of CUDA libraries
      # that the tests never use.
      - name: Install PyTorch (CPU)
        run: python -m pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput --verbosity 2
