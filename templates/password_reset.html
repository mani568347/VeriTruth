{% extends 'base.html' %}
{% block content %}

<div class="auth-wrapper vt-animate-fade">
    <div class="auth-card">
        <div class="auth-header">
            <div style="width: 40px; height: 40px; border-radius: 10px; background-color: var(--vt-brand-light); color: var(--vt-brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 18px;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Password Recovery</h2>
            <p>Enter your account email to receive a secure recovery token</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="gov-alert gov-alert-success">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="vt-form-group" style="margin-bottom: 20px;">
                <label class="vt-label" for="email">Account Email Address</label>
                <input id="email" name="email" type="email" class="vt-input" placeholder="researcher@institution.org" required>
            </div>
            <button type="submit" class="vt-btn vt-btn-primary vt-btn-full">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Send Reset Token</span>
            </button>
        </form>

        <div class="auth-footer" style="margin-top: 24px;">
            <a href="/login/" style="font-weight: 600;"><i class="fa-solid fa-chevron-left" style="font-size: 11px; margin-right: 6px;"></i>Return to Sign In</a>
        </div>
    </div>
</div>

{% endblock %}
